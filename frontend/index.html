<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Studio v5 — Agentic Tool Suite</title>
  <link rel="icon" href="/hermes.ico" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #09090b;
      --bg-subtle: #0f0f12;
      --surface: rgba(255,255,255,0.03);
      --surface-hover: rgba(255,255,255,0.06);
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.06);
      --border-focus: rgba(255,255,255,0.15);
      --fg: #fafafa;
      --fg-secondary: #a1a1aa;
      --fg-muted: #52525b;
      --accent: #22d3ee;
      --accent-dim: rgba(34,211,238,0.12);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --yellow: #eab308;
      --yellow-dim: rgba(234,179,8,0.12);
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow: 0 0 0 1px var(--border), 0 4px 24px rgba(0,0,0,0.4);
      --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      width: 28px; height: 28px;
      border-radius: var(--radius-xs);
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: grid; place-items: center;
      font-weight: 700; font-size: 0.75rem;
      color: #000;
    }

    .logo-text {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .logo-version {
      font-size: 0.55rem;
      color: var(--fg-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-left: auto;
    }

    .sidebar-section {
      padding: 0.75rem 0;
    }

    .sidebar-label {
      padding: 0 1rem;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 0.4rem;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      cursor: default;
    }

    .model-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .model-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .model-dot.off { background: var(--red); box-shadow: 0 0 6px var(--red); }

    .model-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--fg-secondary);
    }

    .workspace-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 1rem 0.25rem calc(1rem + var(--depth, 0) * 12px);
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg-secondary);
      cursor: default;
    }

    .tree-item:hover { background: var(--surface-hover); }

    .tree-icon { font-size: 0.65rem; width: 14px; text-align: center; }
    .tree-icon.dir { color: var(--accent); }
    .tree-icon.file { color: var(--fg-muted); }

    .tree-name { flex: 1; }
    .tree-size { color: var(--fg-muted); font-size: 0.6rem; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      flex-shrink: 0;
    }

    .mode-tabs {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 2px;
      border: 1px solid var(--border);
    }

    .mode-tab {
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-xs);
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--fg-muted);
      border: none;
      background: none;
    }

    .mode-tab.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .mode-tab:hover:not(.active) { color: var(--fg-secondary); }

    .topbar-spacer { flex: 1; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
      color: var(--fg-muted);
    }

    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
    }

    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }

    /* ── Content Area ── */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Chat Panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .messages {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.82rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent-dim);
      border: 1px solid rgba(34,211,238,0.15);
      color: var(--fg);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .msg .badge {
      display: inline-block;
      margin-top: 0.4rem;
      padding: 0.1rem 0.45rem;
      border-radius: var(--radius-xs);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      font-weight: 500;
    }

    .badge.coding { background: var(--blue-dim); color: var(--blue); }
    .badge.reasoning { background: var(--green-dim); color: var(--green); }
    .badge.agent { background: var(--purple-dim); color: var(--purple); }

    .msg img {
      max-width: 220px; max-height: 160px;
      margin-top: 0.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    /* ── Agent Stream Panel ── */
    .agent-panel {
      width: 380px;
      border-left: 1px solid var(--border);
      display: none;
      flex-direction: column;
      background: var(--bg-subtle);
    }

    .agent-panel.visible { display: flex; }

    .agent-header {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .agent-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      flex: 1;
    }

    .agent-step-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--fg-muted);
    }

    .agent-stream {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .stream-entry {
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.3rem;
      border-radius: var(--radius-xs);
      border-left: 2px solid var(--border);
      background: var(--surface);
      animation: fadeIn 0.2s ease;
    }

    .stream-entry.tool-call { border-left-color: var(--accent); }
    .stream-entry.tool-result { border-left-color: var(--green); }
    .stream-entry.tool-error { border-left-color: var(--red); }
    .stream-entry.agent-text { border-left-color: var(--purple); }
    .stream-entry.agent-step { border-left-color: var(--yellow); background: var(--yellow-dim); }

    .stream-entry-header {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.2rem;
    }

    .stream-tool-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--accent);
    }

    .stream-entry.agent-text .stream-tool-name { color: var(--purple); }
    .stream-entry.agent-step .stream-tool-name { color: var(--yellow); }

    .stream-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem;
      color: var(--fg-muted);
      margin-left: auto;
    }

    .stream-entry-body {
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg-secondary);
      line-height: 1.5;
      word-break: break-all;
    }

    .stream-entry-body .cmd {
      color: var(--accent);
    }

    .stream-entry-body .path {
      color: var(--green);
    }

    .stream-entry-body .err {
      color: var(--red);
    }

    /* ── Input Area ── */
    .input-area {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--bg-subtle);
    }

    .input-wrapper {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.5rem;
      transition: border-color var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .file-btn {
      width: 30px; height: 30px;
      border-radius: var(--radius-xs);
      background: none;
      border: 1px solid var(--border);
      display: grid; place-items: center;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--fg-muted);
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .file-btn:hover { border-color: var(--accent); color: var(--accent); }
    .file-btn input { display: none; }

    textarea {
      flex: 1;
      background: none;
      border: none; outline: none;
      resize: none;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--fg);
      padding: 0.3rem 0.2rem;
      min-height: 1.8rem;
      max-height: 120px;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--fg-muted); }

    .send-btn {
      width: 30px; height: 30px;
      border-radius: var(--radius-xs);
      background: var(--accent);
      color: #000;
      font-weight: 700; font-size: 0.8rem;
      display: grid; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      border: none;
      transition: all var(--transition);
    }

    .send-btn:hover { background: #06b6d4; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .stop-btn {
      width: 30px; height: 30px;
      border-radius: var(--radius-xs);
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      display: none; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      border: none;
    }

    .stop-btn.visible { display: grid; }

    .input-hint {
      font-size: 0.55rem;
      color: var(--fg-muted);
      padding: 0.3rem 0 0 0;
      text-align: right;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .agent-panel { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">H</div>
          <span class="logo-text">HERMES</span>
          <span class="logo-version">v5</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Models</div>
        <div class="model-item">
          <div class="model-dot" id="dot-reasoning"></div>
          <span class="model-name" id="name-reasoning">...</span>
        </div>
        <div class="model-item">
          <div class="model-dot" id="dot-coding"></div>
          <span class="model-name" id="name-coding">...</span>
        </div>
        <div class="model-item">
          <div class="model-dot" id="dot-agent"></div>
          <span class="model-name" id="name-agent">...</span>
        </div>
        <div class="model-item">
          <div class="model-dot" id="dot-vision"></div>
          <span class="model-name" id="name-vision">...</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Safety</div>
        <div class="model-item">
          <div class="model-dot on"></div>
          <span class="model-name" style="color: var(--green)">ACTIVE</span>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Workspace</div>
      </div>
      <div class="workspace-tree" id="workspace-tree"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <!-- Top Bar -->
      <div class="topbar">
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="chat" onclick="switchMode('chat')">Chat</button>
          <button class="mode-tab" data-mode="agent" onclick="switchMode('agent')">Agent</button>
          <button class="mode-tab" data-mode="memory" onclick="switchMode('memory')">Memory</button>
          <button class="mode-tab" data-mode="planning" onclick="switchMode('planning')">Planning</button>
          <button class="mode-tab" data-mode="code-intel" onclick="switchMode('code-intel')">Code Intel</button>
          <button class="mode-tab" data-mode="vision" onclick="switchMode('vision')">Vision</button>
        </div>
        <div class="topbar-spacer"></div>
        <div class="status-pill">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">connecting...</span>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="chat-panel">
          <div class="messages" id="messages"></div>
        </div>

        <!-- Agent Stream Panel -->
        <div class="agent-panel" id="agent-panel">
          <div class="agent-header">
            <span class="agent-title">Live Execution Stream</span>
            <span class="agent-step-counter" id="agent-step-counter">step 0/0</span>
          </div>
          <div style="padding: 0.5rem; border-bottom: 1px solid var(--border);">
            <div class="sidebar-label" style="margin-bottom: 0.3rem;">Quick Scaffold</div>
            <div style="display: flex; flex-wrap: wrap; gap: 0.3rem;">
              <button class="mode-tab" onclick="scaffold('react-ts')" style="font-size: 0.6rem; padding: 0.2rem 0.5rem;">React+TS</button>
              <button class="mode-tab" onclick="scaffold('python-fastapi')" style="font-size: 0.6rem; padding: 0.2rem 0.5rem;">FastAPI</button>
              <button class="mode-tab" onclick="scaffold('node-express')" style="font-size: 0.6rem; padding: 0.2rem 0.5rem;">Express</button>
              <button class="mode-tab" onclick="scaffold('static-html')" style="font-size: 0.6rem; padding: 0.2rem 0.5rem;">Static</button>
            </div>
          </div>
          <div class="agent-stream" id="agent-stream"></div>
        </div>

        <!-- Memory Panel -->
        <div class="panel" id="memory-panel" style="display:none; flex-direction:column; height:100%;">
          <div class="agent-header">
            <span class="agent-title">Project Memory</span>
            <button class="mode-tab" onclick="scanProject()" style="font-size:0.7rem; padding:0.3rem 0.6rem;">Scan Project</button>
          </div>
          <div id="memory-list" style="flex:1; overflow-y:auto; padding:1rem;"></div>
          <div class="input-area" style="padding:0.5rem;">
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="memory-fact-type" placeholder="Type (structure/pattern/error/preference)" style="flex:1;" />
              <input type="text" id="memory-fact-content" placeholder="Fact content..." style="flex:2;" />
              <button class="send-btn" onclick="rememberFact()">Remember</button>
            </div>
          </div>
        </div>

        <!-- Planning Panel -->
        <div class="panel" id="planning-panel" style="display:none; flex-direction:column; height:100%;">
          <div class="agent-header">
            <span class="agent-title">Task Planning</span>
            <button class="mode-tab" onclick="createPlan()" style="font-size:0.7rem; padding:0.3rem 0.6rem;">New Plan</button>
          </div>
          <div id="plans-list" style="flex:1; overflow-y:auto; padding:1rem;"></div>
        </div>

        <!-- Code Intel Panel -->
        <div class="panel" id="code-intel-panel" style="display:none; flex-direction:column; height:100%;">
          <div class="agent-header">
            <span class="agent-title">Code Intelligence</span>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="code-search-query" placeholder="Search code..." style="width:200px;" />
              <button class="mode-tab" onclick="searchCode()">Search</button>
              <button class="mode-tab" onclick="getApiEndpoints()">API Endpoints</button>
            </div>
          </div>
          <div id="code-intel-results" style="flex:1; overflow-y:auto; padding:1rem;"></div>
        </div>

        <!-- Vision Panel -->
        <div class="panel" id="vision-panel" style="display:none; flex-direction:column; height:100%;">
          <div class="agent-header">
            <span class="agent-title">Vision + 3D</span>
            <div style="display:flex; gap:0.5rem;">
              <button class="mode-tab" onclick="document.getElementById('vision-file-input').click()">Upload Image</button>
              <button class="mode-tab" onclick="generate3D()">Generate 3D</button>
            </div>
            <input type="file" id="vision-file-input" accept="image/*" style="display:none;" onchange="analyzeImage(event)" />
          </div>
          <div id="vision-results" style="flex:1; overflow-y:auto; padding:1rem;"></div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <label class="file-btn">
            <input type="file" id="file-input" accept="image/*,.txt,.md,.json,.ts,.tsx,.py,.html,.css" onchange="handleFile(event)"/>
            +
          </label>
          <textarea id="input" placeholder="Describe what to build..." onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="send-btn" onclick="send()">&#8593;</button>
          <button class="stop-btn" id="stop-btn" onclick="stop()">x</button>
        </div>
        <div class="input-hint">Enter = send | Shift+Enter = newline | 15 tools | Safety active | Plugins supported</div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://127.0.0.1:8765';
    const evtSource = new EventSource(API + '/api/events');

    let messages = [];
    let pendingFile = null;
    let pendingB64 = null;
    let isStreaming = false;
    let abortCtrl = null;
    let mode = 'chat';
    let agentSteps = [];

    const $msgs = document.getElementById('messages');
    const $input = document.getElementById('input');
    const $sendBtn = document.getElementById('send-btn');
    const $stopBtn = document.getElementById('stop-btn');
    const $agentPanel = document.getElementById('agent-panel');
    const $agentStream = document.getElementById('agent-stream');
    const $agentStepCounter = document.getElementById('agent-step-counter');

    messages.push({
      role: 'assistant',
      text: 'Hermes v5 — Agentic Tool Suite.\n\nChat mode: ask anything, get answers.\nAgent mode: describe a project, Hermes builds it with tools on your disk.\n\nNew: Memory, Planning, Code Intelligence, Agent-to-Agent, Vision+3D.',
      route: 'reasoning'
    });
    render();

    function render() {
      $msgs.innerHTML = messages.map((m, i) => {
        const cls = m.role === 'user' ? 'msg user' : 'msg ai';
        let badge = '';
        if (m.role === 'assistant' && m.route) {
          const labels = { coding: 'qwen2.5-coder', reasoning: 'deepseek-r1', agent: 'agent-loop' };
          badge = `<div class="badge ${m.route}">${labels[m.route] || m.route}</div>`;
        }
        let img = '';
        if (m.img) img = `<img src="${m.img}"/>`;
        return `<div class="${cls}">${escapeHtml(m.text)}${badge}${img}</div>`;
      }).join('');
      $msgs.scrollTop = $msgs.scrollHeight;
    }

    function escapeHtml(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function switchMode(m) {
      mode = m;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
      if (m === 'agent') {
        $agentPanel.classList.add('visible');
        $input.placeholder = 'Describe the project to build (e.g. "Create a React todo app with TypeScript and Tailwind")';
      } else {
        $agentPanel.classList.remove('visible');
        $input.placeholder = 'Describe what to build...';
      }
    }

    function handleFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      pendingFile = f;
      if (f.type.startsWith('image/')) {
        const r = new FileReader();
        r.onload = () => { pendingB64 = r.result.split(',')[1]; };
        r.readAsDataURL(f);
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    async function send() {
      const prompt = $input.value.trim();
      if ((!prompt && !pendingFile) || isStreaming) return;

      const imgB64 = pendingB64;
      pendingFile = null;
      pendingB64 = null;
      $input.value = '';

      if (mode === 'agent') {
        await sendAgent(prompt);
      } else {
        await sendChat(prompt, imgB64);
      }
    }

    async function sendChat(prompt, imgB64) {
      messages.push({ role: 'user', text: prompt || '[file]', img: imgB64 ? 'data:image/png;base64,' + imgB64 : undefined });
      messages.push({ role: 'assistant', text: '', route: '' });
      render();

      isStreaming = true;
      abortCtrl = new AbortController();
      $sendBtn.style.display = 'none';
      $stopBtn.classList.add('visible');

      const history = messages.slice(0, -2).slice(-8).map(m => ({ role: m.role, content: m.text }));
      const body = { prompt, history };
      if (imgB64) body.images = [imgB64];

      try {
        const r = await fetch(API + '/api/chat?stream=1', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: abortCtrl.signal,
        });

        if (!r.ok || !r.body) throw new Error('Stream failed');

        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        let activeRoute = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });

          const parts = buf.split('\n\n');
          buf = parts.pop();

          for (const p of parts) {
            if (!p.startsWith('data: ')) continue;
            try {
              const j = JSON.parse(p.slice(6));
              if (j.model) activeRoute = j.route || '';
              if (j.done) break;
              if (j.text) {
                messages[messages.length - 1].text += j.text;
                messages[messages.length - 1].route = activeRoute;
                render();
              }
            } catch {}
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          messages[messages.length - 1].text += ' [stopped]';
        } else {
          try {
            const r = await fetch(API + '/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt, history }),
            });
            const j = await r.json();
            messages[messages.length - 1].text = j.text || 'Error';
            messages[messages.length - 1].route = j.route || '';
          } catch {
            messages[messages.length - 1].text = 'Connection error. Is the server running?';
          }
        }
      }

      isStreaming = false;
      abortCtrl = null;
      $sendBtn.style.display = '';
      $stopBtn.classList.remove('visible');
      render();
    }

    async function sendAgent(task) {
      messages.push({ role: 'user', text: task });
      messages.push({ role: 'assistant', text: '', route: 'agent' });
      render();

      agentSteps = [];
      $agentStream.innerHTML = '';
      $agentStepCounter.textContent = 'starting...';
      isStreaming = true;
      abortCtrl = new AbortController();
      $sendBtn.style.display = 'none';
      $stopBtn.classList.add('visible');

      try {
        const r = await fetch(API + '/api/agent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task }),
          signal: abortCtrl.signal,
        });

        if (!r.ok || !r.body) throw new Error('Agent stream failed');

        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });

          const parts = buf.split('\n\n');
          buf = parts.pop();

          for (const p of parts) {
            if (!p.startsWith('data: ')) continue;
            try {
              const j = JSON.parse(p.slice(6));
              handleAgentEvent(j);
            } catch {}
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          addStreamEntry('agent-text', 'Aborted by user.');
        } else {
          addStreamEntry('tool-error', `Error: ${e.message}`);
        }
      }

      isStreaming = false;
      abortCtrl = null;
      $sendBtn.style.display = '';
      $stopBtn.classList.remove('visible');
    }

    function handleAgentEvent(ev) {
      if (ev.type === 'step') {
        const args = typeof ev.args === 'string' ? ev.args : JSON.stringify(ev.args);
        let body = '';
        if (ev.tool === 'workspace_file_ops') {
          const a = typeof ev.args === 'string' ? JSON.parse(ev.args || '{}') : (ev.args || {});
          body = `<span class="cmd">${a.action || 'write'}</span> <span class="path">${a.path || ''}</span>`;
        } else if (ev.tool === 'execute_shell_command') {
          const a = typeof ev.args === 'string' ? JSON.parse(ev.args || '{}') : (ev.args || {});
          body = `<span class="cmd">${a.command || ''}</span>`;
        } else if (ev.tool === 'git_checkpoint') {
          const a = typeof ev.args === 'string' ? JSON.parse(ev.args || '{}') : (ev.args || {});
          body = `commit: ${a.message || ''}`;
        } else if (ev.tool === 'analyze_project_structure') {
          body = 'scanning workspace...';
        } else if (ev.tool === 'done') {
          body = `<span class="path">${ev.args?.summary || 'task complete'}</span>`;
        } else {
          body = args;
        }
        addStreamEntry('tool-call', body, ev.tool);
        $agentStepCounter.textContent = `step ${ev.step}`;
      } else if (ev.type === 'done') {
        const r = ev.result || {};
        const summary = r.summary || 'Done.';
        messages[messages.length - 1].text = summary;
        addStreamEntry('agent-step', `Finished in ${r.steps || 0} steps.`);
        render();
      } else if (ev.type === 'error') {
        addStreamEntry('tool-error', ev.error);
      }
    }

    function addStreamEntry(cls, body, toolName) {
      const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const div = document.createElement('div');
      div.className = `stream-entry ${cls}`;
      div.innerHTML = `
        <div class="stream-entry-header">
          <span class="stream-tool-name">${toolName || cls}</span>
          <span class="stream-time">${now}</span>
        </div>
        <div class="stream-entry-body">${body}</div>
      `;
      $agentStream.appendChild(div);
      $agentStream.scrollTop = $agentStream.scrollHeight;
    }

    async function scaffold(template) {
      const name = prompt("Project name:");
      if (!name) return;
      switchMode('agent');
      const task = `Scaffold a ${template} project named "${name}". Use scaffold_project tool with template="${template}" and name="${name}". Then read the created files and verify they look correct.`;
      $input.value = task;
      send();
    }

    function stop() {
      if (abortCtrl) abortCtrl.abort();
      isStreaming = false;
    }

    // ── SSE Events ──
    evtSource.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if (m.event === 'agent.tool_call') {
          const tool = m.payload?.tool || '';
          const args = m.payload?.args || '';
          addStreamEntry('tool-call', args, tool);
        } else if (m.event === 'agent.text') {
          addStreamEntry('agent-text', m.payload?.text || '');
        } else if (m.event === 'agent.error') {
          addStreamEntry('tool-error', m.payload?.error || '');
        }
      } catch {}
    };

    // ── Model Status ──
    async function checkModels() {
      try {
        const r = await fetch(API + '/api/models');
        const s = await r.json();

        const dots = { reasoning: 'dot-reasoning', coding: 'dot-coding', agent: 'dot-agent', vision: 'dot-vision' };
        const names = { reasoning: 'name-reasoning', coding: 'name-coding', agent: 'name-agent', vision: 'name-vision' };

        for (const key of ['reasoning', 'coding', 'agent', 'vision']) {
          const dot = document.getElementById(dots[key]);
          const name = document.getElementById(names[key]);
          if (dot && name) {
            if (s.ollama?.available && s[key]?.installed) {
              dot.className = 'model-dot on';
              name.textContent = s[key].model;
            } else {
              dot.className = 'model-dot off';
              name.textContent = s[key]?.model || 'offline';
            }
          }
        }

        document.getElementById('status-dot').className = 'status-dot ' + (s.ollama?.available ? 'ok' : 'err');
        document.getElementById('status-text').textContent = s.ollama?.available ? 'online' : 'offline';
      } catch {
        document.getElementById('status-dot').className = 'status-dot err';
        document.getElementById('status-text').textContent = 'error';
      }
    }

    // ── Workspace Tree ──
    async function loadWorkspace() {
      try {
        const r = await fetch(API + '/api/workspace');
        const data = await r.json();
        renderTree(data.tree || [], 0);
      } catch {
        document.getElementById('workspace-tree').innerHTML = '<div class="tree-item"><span class="tree-name" style="color:var(--fg-muted)">unable to load</span></div>';
      }
    }

    function renderTree(nodes, depth) {
      const container = document.getElementById('workspace-tree');
      for (const n of nodes) {
        const div = document.createElement('div');
        div.className = 'tree-item';
        div.style.setProperty('--depth', depth);
        const icon = n.type === 'dir' ? 'folder' : 'file';
        const size = n.type === 'file' && n.size ? formatSize(n.size) : '';
        div.innerHTML = `<span class="tree-icon ${n.type === 'dir' ? 'dir' : 'file'}">${n.type === 'dir' ? '&#128193;' : '&#128196;'}</span><span class="tree-name">${n.name}</span>${size ? `<span class="tree-size">${size}</span>` : ''}`;
        container.appendChild(div);
        if (n.type === 'dir' && n.children) renderTree(n.children, depth + 1);
      }
    }

    function formatSize(b) {
      if (b < 1024) return b + 'B';
      if (b < 1048576) return (b / 1024).toFixed(1) + 'K';
      return (b / 1048576).toFixed(1) + 'M';
    }

    checkModels();
    loadWorkspace();
    setInterval(checkModels, 15000);
    setInterval(loadWorkspace, 30000);

    // ── Phase 3: Memory Functions ──
    async function scanProject() {
      const path = prompt("Project path to scan:", API);
      if (!path) return;
      try {
        const r = await fetch(API + '/api/memory/scan', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({path})
        });
        const data = await r.json();
        document.getElementById('memory-list').innerHTML = `<pre style="color:var(--green); white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre>`;
      } catch(e) {
        document.getElementById('memory-list').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
      }
    }

    async function rememberFact() {
      const type = document.getElementById('memory-fact-type').value;
      const content = document.getElementById('memory-fact-content').value;
      if (!content) return;
      try {
        await fetch(API + '/api/memory/projects/default/remember', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({type, content})
        });
        document.getElementById('memory-fact-content').value = '';
        loadMemories();
      } catch(e) {
        console.error(e);
      }
    }

    async function loadMemories() {
      try {
        const r = await fetch(API + '/api/memory/projects/default/recall?q=');
        const data = await r.json();
        const list = document.getElementById('memory-list');
        list.innerHTML = (data.facts || []).map(f =>
          `<div style="padding:0.5rem; margin:0.3rem 0; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <span style="color:var(--accent); font-size:0.75rem;">${f.type}</span>
            <div style="color:var(--fg); margin-top:0.2rem;">${f.content}</div>
          </div>`
        ).join('');
      } catch(e) {}
    }

    // ── Phase 4: Planning Functions ──
    async function createPlan() {
      const task = prompt("Describe the task to plan:");
      if (!task) return;
      try {
        const r = await fetch(API + '/api/plans', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({task, context: ''})
        });
        const data = await r.json();
        loadPlans();
      } catch(e) {
        console.error(e);
      }
    }

    async function loadPlans() {
      try {
        const r = await fetch(API + '/api/plans');
        const data = await r.json();
        const list = document.getElementById('plans-list');
        list.innerHTML = (data.plans || []).map(p =>
          `<div style="padding:0.7rem; margin:0.4rem 0; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between;">
              <span style="color:var(--accent); font-weight:600;">${p.task || 'Untitled'}</span>
              <span style="color:${p.status === 'completed' ? 'var(--green)' : 'var(--yellow)'}; font-size:0.75rem;">${p.status}</span>
            </div>
            <div style="color:var(--fg-muted); font-size:0.75rem; margin-top:0.3rem;">${(p.phases || []).length} phases</div>
          </div>`
        ).join('') || '<div style="color:var(--fg-muted); padding:1rem;">No plans yet. Click "New Plan" to create one.</div>';
      } catch(e) {}
    }

    // ── Phase 5: Code Intelligence Functions ──
    async function searchCode() {
      const query = document.getElementById('code-search-query').value;
      if (!query) return;
      try {
        const r = await fetch(API + '/api/code-intel/search', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query, path: API})
        });
        const data = await r.json();
        const results = document.getElementById('code-intel-results');
        results.innerHTML = (data.results || []).map(r =>
          `<div style="padding:0.5rem; margin:0.3rem 0; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <span style="color:var(--green); font-family:var(--font-mono); font-size:0.75rem;">${r.file}:${r.line || ''}</span>
            <div style="color:var(--fg); margin-top:0.2rem; font-family:var(--font-mono); font-size:0.8rem;">${r.content || r.text || ''}</div>
          </div>`
        ).join('') || '<div style="color:var(--fg-muted);">No results found.</div>';
      } catch(e) {
        document.getElementById('code-intel-results').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
      }
    }

    async function getApiEndpoints() {
      try {
        const r = await fetch(API + '/api/code-intel/api-discovery', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({path: API})
        });
        const data = await r.json();
        const results = document.getElementById('code-intel-results');
        results.innerHTML = (data.endpoints || []).map(e =>
          `<div style="padding:0.5rem; margin:0.3rem 0; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <span style="color:var(--yellow); font-weight:600;">${e.method}</span>
            <span style="color:var(--fg); font-family:var(--font-mono);">${e.path}</span>
            <span style="color:var(--fg-muted); font-size:0.75rem; margin-left:0.5rem;">${e.file}:${e.line}</span>
          </div>`
        ).join('') || '<div style="color:var(--fg-muted);">No API endpoints found.</div>';
      } catch(e) {
        document.getElementById('code-intel-results').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
      }
    }

    // ── Phase 7: Vision Functions ──
    async function analyzeImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        try {
          const r = await fetch(API + '/api/vision/analyze', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({image: base64})
          });
          const data = await r.json();
          const results = document.getElementById('vision-results');
          results.innerHTML = `<div style="padding:0.7rem; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <div style="color:var(--accent); font-weight:600; margin-bottom:0.5rem;">Analysis Result</div>
            <pre style="color:var(--fg); white-space:pre-wrap; font-size:0.8rem;">${JSON.stringify(data, null, 2)}</pre>
          </div>`;
        } catch(e) {
          document.getElementById('vision-results').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
        }
      };
      reader.readAsDataURL(file);
    }

    async function generate3D() {
      const desc = prompt("Describe the 3D scene (e.g., 'a red cube rotating on a blue plane'):");
      if (!desc) return;
      try {
        const r = await fetch(API + '/api/3d/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({description: desc})
        });
        const data = await r.json();
        if (data.html) {
          const w = window.open('', '_blank');
          w.document.write(data.html);
          w.document.close();
        }
      } catch(e) {
        document.getElementById('vision-results').innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
